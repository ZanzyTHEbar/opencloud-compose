---
services:
  opencloud:
    image: ${OC_DOCKER_IMAGE:-opencloudeu/opencloud-rolling}:${OC_DOCKER_TAG:-latest}
    # changelog: https://github.com/opencloud-eu/opencloud/tree/main/changelog
    # release notes: https://docs.opencloud.eu/opencloud_release_notes.html
    user: ${OC_CONTAINER_UID_GID:-1000:1000}
    networks:
      coolify:
    entrypoint:
      - /bin/sh
    # run opencloud init to initialize a configuration file with random secrets
    # it will fail on subsequent runs, because the config file already exists
    # therefore we ignore the error and then start the opencloud server
    command: ["-c", "opencloud init || true; opencloud server"]
    environment:
      # enable services that are not started automatically
      OC_ADD_RUN_SERVICES: ${START_ADDITIONAL_SERVICES}
      OC_URL: https://${OC_DOMAIN:-cloud.opencloud.test}
      OC_LOG_LEVEL: ${LOG_LEVEL:-info}
      OC_LOG_COLOR: "${LOG_PRETTY:-false}"
      OC_LOG_PRETTY: "${LOG_PRETTY:-false}"
      # do not use SSL between the reverse proxy and OpenCloud
      PROXY_TLS: "false"
      # INSECURE: needed if OpenCloud / reverse proxy is using self generated certificates
      OC_INSECURE: "${INSECURE:-false}"
      # basic auth (not recommended, but needed for eg. WebDav clients that do not support OpenID Connect)
      # basic auth (not recommended, CalDAV/CardDAV clients should use App Tokens instead)
      PROXY_ENABLE_BASIC_AUTH: "${PROXY_ENABLE_BASIC_AUTH:-false}"
      # demo users
      IDM_CREATE_DEMO_USERS: "${DEMO_USERS:-false}"
      # admin password
      IDM_ADMIN_PASSWORD: "${INITIAL_ADMIN_PASSWORD}"
      # email server (if configured)
      NOTIFICATIONS_SMTP_HOST: "${SMTP_HOST}"
      NOTIFICATIONS_SMTP_PORT: "${SMTP_PORT}"
      NOTIFICATIONS_SMTP_SENDER: "${SMTP_SENDER:-OpenCloud Notifications <notifications@cloud.opencloud.test>}"
      NOTIFICATIONS_SMTP_USERNAME: "${SMTP_USERNAME}"
      NOTIFICATIONS_SMTP_PASSWORD: "${SMTP_PASSWORD}"
      NOTIFICATIONS_SMTP_INSECURE: "${SMTP_INSECURE:-false}"
      NOTIFICATIONS_SMTP_AUTHENTICATION: "${SMTP_AUTHENTICATION}"
      NOTIFICATIONS_SMTP_ENCRYPTION: "${SMTP_TRANSPORT_ENCRYPTION:-none}"
      FRONTEND_ARCHIVER_MAX_SIZE: "10000000000"
      FRONTEND_CHECK_FOR_UPDATES: "${CHECK_FOR_UPDATES:-true}"
      # Explicit CSP config -- mounted via Docker Compose configs at /opt/opencloud/csp.yaml
      # (outside the /etc/opencloud bind mount). Env-var auto-generation doesn't work reliably
      # when opencloud.yaml is persisted across restarts.
      PROXY_CSP_CONFIG_FILE_LOCATION: /opt/opencloud/csp.yaml
      # enable to allow using the banned passwords list
      OC_PASSWORD_POLICY_BANNED_PASSWORDS_LIST: banned-password-list.txt
      # control the password enforcement and policy for public shares
      OC_SHARING_PUBLIC_SHARE_MUST_HAVE_PASSWORD: "${OC_SHARING_PUBLIC_SHARE_MUST_HAVE_PASSWORD:-true}"
      OC_SHARING_PUBLIC_WRITEABLE_SHARE_MUST_HAVE_PASSWORD: "${OC_SHARING_PUBLIC_WRITEABLE_SHARE_MUST_HAVE_PASSWORD:-false}"
      OC_PASSWORD_POLICY_DISABLED: "${OC_PASSWORD_POLICY_DISABLED:-false}"
      OC_PASSWORD_POLICY_MIN_CHARACTERS: "${OC_PASSWORD_POLICY_MIN_CHARACTERS:-8}"
      OC_PASSWORD_POLICY_MIN_LOWERCASE_CHARACTERS: "${OC_PASSWORD_POLICY_MIN_LOWERCASE_CHARACTERS:-1}"
      OC_PASSWORD_POLICY_MIN_UPPERCASE_CHARACTERS: "${OC_PASSWORD_POLICY_MIN_UPPERCASE_CHARACTERS:-1}"
      OC_PASSWORD_POLICY_MIN_DIGITS: "${OC_PASSWORD_POLICY_MIN_DIGITS:-1}"
      OC_PASSWORD_POLICY_MIN_SPECIAL_CHARACTERS: "${OC_PASSWORD_POLICY_MIN_SPECIAL_CHARACTERS:-1}"
      # default language for services/WebUI; defaults to English, language code (ISO 639-1, e.g. de, en, fr)
      OC_DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE}

      # collabora integration
      COLLABORA_DOMAIN: ${COLLABORA_DOMAIN:-collabora.opencloud.test}
      NATS_NATS_HOST: 0.0.0.0
      GATEWAY_GRPC_ADDR: 0.0.0.0:9142
      FRONTEND_APP_HANDLER_SECURE_VIEW_APP_ADDR: eu.opencloud.api.collaboration
      GRAPH_AVAILABLE_ROLES: "b1e2218d-eef8-4d4c-b82d-0f1a1b48f3b5,a8d5fe5e-96e3-418d-825b-534dbdf22b99,fb6c3e19-e378-47e5-b277-9732f9de6e21,58c63c02-1d89-4572-916a-870abc5a1b7d,2d00ce52-1fc2-4dbc-8b95-a73b73395f5a,1c996275-f1c9-4e71-abdf-a42f6495e960,312c0871-5ef7-4b3a-85b6-0e4074c64049,aa97fe03-7980-45ac-9e50-b325749fd7e6"

      # fulltext search
      SEARCH_EXTRACTOR_TYPE: tika
      SEARCH_EXTRACTOR_TIKA_TIKA_URL: http://tika:9998
      FRONTEND_FULL_TEXT_SEARCH_ENABLED: "true"

      # antivirus
      POSTPROCESSING_STEPS: "virusscan"
      STORAGE_USERS_DATA_GATEWAY_URL: "http://opencloud:9200/data"
      ANTIVIRUS_MAX_SCAN_SIZE: ${ANTIVIRUS_MAX_SCAN_SIZE:-100MB}
      ANTIVIRUS_INFECTED_FILE_HANDLING: abort
      ANTIVIRUS_MAX_SCAN_SIZE_MODE: ${ANTIVIRUS_MAX_SCAN_SIZE_MODE:-partial}
      ANTIVIRUS_WORKERS: 1
      ANTIVIRUS_CLAMAV_SOCKET: /var/run/clamav/clamd.sock
      ANTIVIRUS_SCANNER_TYPE: clamav

      # collaborative mode: detect external filesystem changes (NFS/bind-mount shared data)
      STORAGE_USERS_POSIX_WATCH_FS: "${STORAGE_USERS_POSIX_WATCH_FS:-true}"

      # metrics
      PROXY_DEBUG_ADDR: 0.0.0.0:9205

      # external IdP (Authentik) + LDAP outpost
      OC_LDAP_URI: ${AUTHENTIK_LDAP_URI:-ldap://authentik-ldap:3389}
      OC_LDAP_INSECURE: "${AUTHENTIK_LDAP_INSECURE:-true}"
      OC_LDAP_BIND_DN: ${AUTHENTIK_LDAP_BIND_DN:-cn=ldapservice,ou=users,dc=ldap,dc=goauthentik,dc=io}
      OC_LDAP_BIND_PASSWORD: ${AUTHENTIK_LDAP_BIND_PASSWORD}
      OC_LDAP_GROUP_BASE_DN: ${AUTHENTIK_LDAP_GROUP_BASE_DN:-ou=groups,dc=ldap,dc=goauthentik,dc=io}
      OC_LDAP_USER_BASE_DN: ${AUTHENTIK_LDAP_USER_BASE_DN:-ou=users,dc=ldap,dc=goauthentik,dc=io}
      OC_LDAP_USER_FILTER: ${AUTHENTIK_LDAP_USER_FILTER:-(objectClass=user)}
      # Authentik LDAP attribute mapping:
      #   cn = username, uid = stable unique hash, sAMAccountName = username
      # OC_LDAP_USER_SCHEMA_ID: unique user ID attribute (default 'openclouduuid' does not exist in Authentik)
      OC_LDAP_USER_SCHEMA_ID: ${AUTHENTIK_LDAP_USER_SCHEMA_ID:-uid}
      # OC_LDAP_USER_SCHEMA_USERNAME: attribute used for username lookups (default 'uid' is a hash in Authentik)
      OC_LDAP_USER_SCHEMA_USERNAME: cn
      OC_LDAP_GROUP_SCHEMA_ID: ${AUTHENTIK_LDAP_GROUP_SCHEMA_ID:-cn}
      OC_LDAP_GROUP_SCHEMA_GROUPNAME: cn
      GRAPH_LDAP_SERVER_UUID: "false"
      GRAPH_LDAP_REFINT_ENABLED: "false"
      FRONTEND_READONLY_USER_ATTRIBUTES: "user.onPremisesSamAccountName,user.displayName,user.mail,user.passwordProfile,user.accountEnabled,user.appRoleAssignments"
      PROXY_OIDC_REWRITE_WELLKNOWN: "true"
      WEB_OIDC_CLIENT_ID: ${OC_OIDC_CLIENT_ID:-web}
      # Authentik 'OpenCloud Roles' scope mapping emits 'roles' claim
      # based on group membership (opencloud-admins, opencloud-spaceadmins, etc.)
      PROXY_ROLE_ASSIGNMENT_DRIVER: "oidc"
      PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM: "roles"
      OC_OIDC_ISSUER: ${IDP_ISSUER_URL:-https://keycloak.opencloud.test/realms/openCloud}
      # This specifies to start all services except idm and idp. These are replaced by external services.
      OC_EXCLUDE_RUN_SERVICES: idm,idp
      # Authentik LDAP outpost is read-only; disable autoprovisioning
      OC_LDAP_SERVER_WRITE_ENABLED: "false"
      PROXY_AUTOPROVISION_ACCOUNTS: "false"
      # Authentik LDAP exposes 'cn' = username; OIDC 'preferred_username' = username.
      # The default 'sub' claim (UUID) does NOT match Authentik LDAP's 'uid' (hash),
      # so we use 'preferred_username' for both OIDC and LDAP user resolution.
      PROXY_USER_OIDC_CLAIM: "preferred_username"
      PROXY_AUTOPROVISION_CLAIM_USERNAME: "preferred_username"
      PROXY_USER_CS3_CLAIM: "username"
      # Disable user mechanism via LDAP attribute
      OC_LDAP_DISABLE_USER_MECHANISM: "attribute"
      # OC_ADMIN_USER_ID must match the LDAP 'uid' attribute of the admin user.
      # Set OC_ADMIN_USER_ID in Coolify env vars (it's instance-specific).
      OC_ADMIN_USER_ID: ${OC_ADMIN_USER_ID}
      # Requires OC_ADMIN_USER_ID to be set; creates default admin + user role assignments
      SETTINGS_SETUP_DEFAULT_ASSIGNMENTS: "true"
      # With oidc role driver, roles come from Authentik; disable Graph auto-assignment
      GRAPH_ASSIGN_DEFAULT_USER_ROLE: "false"
      GRAPH_USERNAME_MATCH: "none"
      # We need to set the IDP_DOMAIN to allow the CSP rules to be set correctly
      IDP_DOMAIN: ${IDP_DOMAIN:-keycloak.opencloud.test}
      # Companion domain for CSP. For single-domain setup set COMPANION_DOMAIN=your-oc-domain in Coolify.
      COMPANION_DOMAIN: ${COMPANION_DOMAIN:-companion.opencloud.test}
      # Optional: set to :443 or leave unset for default HTTPS port in CSP URLs
      TRAEFIK_PORT_HTTPS: ${TRAEFIK_PORT_HTTPS:-}
      # The openCloud users need to be able to edit their account in the externa IdP
      WEB_OPTION_ACCOUNT_EDIT_LINK_HREF: ${IDP_ACCOUNT_URL}

      # bind to all interfaces for Coolify's Traefik proxy
      PROXY_HTTP_ADDR: "0.0.0.0:9200"
    configs:
      - source: opencloud-csp
        target: /opt/opencloud/csp.yaml
      - source: opencloud-proxy
        target: /etc/opencloud/proxy.yaml
    volumes:
      # bind mounts under ./storage -> /mnt/opencloud (symlink in Coolify app dir)
      - ./storage/config:/etc/opencloud
      - ./storage/data:/var/lib/opencloud
      - ./storage/apps:/var/lib/opencloud/web/assets/apps
      # Optional: external shared data directories (e.g. ZFS datasets, NFS mounts).
      # Set SHARED_DATA_PATH / SHARED_COMMON_PATH in your env to the host mount paths.
      # Defaults to local ./storage/shared/* dirs (created empty if absent).
      - ${SHARED_DATA_PATH:-./storage/shared/data}:/mnt/shared/data
      - ${SHARED_COMMON_PATH:-./storage/shared/common}:/mnt/shared/common
      - clamav-socket:/var/run/clamav
    expose:
      - "9200"
      - "9205"
    logging:
      driver: ${LOG_DRIVER:-local}
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:9205/healthz" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: always
    # Traefik labels are generated by Coolify from per-service domain assignments in the UI.
    # Do NOT add labels here -- they conflict with Coolify's auto-generated ones.

  collaboration:
    image: ${OC_DOCKER_IMAGE:-opencloudeu/opencloud-rolling}:${OC_DOCKER_TAG:-latest}
    user: ${OC_CONTAINER_UID_GID:-1000:1000}
    networks:
      coolify:
    depends_on:
      opencloud:
        condition: service_started
      collabora:
        condition: service_healthy
    entrypoint:
      - /bin/sh
    # Wait 20s for OpenCloud's NATS server to be ready before starting collaboration
    command: [ "-c", "sleep 20 && opencloud collaboration server" ]
    environment:
      COLLABORATION_GRPC_ADDR: 0.0.0.0:9301
      COLLABORATION_HTTP_ADDR: 0.0.0.0:9300
      MICRO_REGISTRY: "nats-js-kv"
      MICRO_REGISTRY_ADDRESS: "opencloud:9233"
      # internal service-to-service routing
      COLLABORATION_WOPI_SRC: http://collaboration:9300
      COLLABORATION_APP_NAME: "CollaboraOnline"
      COLLABORATION_APP_PRODUCT: "Collabora"
      # public URLs (used by clients)
      COLLABORATION_APP_ADDR: https://${COLLABORA_DOMAIN:-collabora.opencloud.test}
      COLLABORATION_APP_ICON: https://${COLLABORA_DOMAIN:-collabora.opencloud.test}/favicon.ico
      COLLABORATION_APP_INSECURE: "${INSECURE:-true}"
      COLLABORATION_CS3API_DATAGATEWAY_INSECURE: "${INSECURE:-true}"
      COLLABORATION_LOG_LEVEL: ${LOG_LEVEL:-info}
      OC_URL: https://${OC_DOMAIN:-cloud.opencloud.test}
      # metrics
      COLLABORATION_DEBUG_ADDR: 0.0.0.0:9304
    volumes:
      - ./storage/config:/etc/opencloud
    expose:
      - "9300"
      - "9304"
    logging:
      driver: ${LOG_DRIVER:-local}
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:9304/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    # Traefik labels are generated by Coolify from per-service domain assignments in the UI.

  collabora:
    image: collabora/code:25.04.7.1.1
    # release notes: https://www.collaboraonline.com/release-notes/
    networks:
      coolify:
    environment:
      # internal service-to-service routing
      aliasgroup1: http://collaboration:9300
      DONT_GEN_SSL_CERT: "YES"
      extra_params: |
        --o:ssl.enable=${COLLABORA_SSL_ENABLE:-true} \
        --o:ssl.ssl_verification=${COLLABORA_SSL_VERIFICATION:-true} \
        --o:ssl.termination=true \
        --o:welcome.enable=false \
        --o:net.frame_ancestors=${OC_DOMAIN:-cloud.opencloud.test} \
        --o:net.lok_allow.host[14]=${OC_DOMAIN:-cloud.opencloud.test} \
        --o:home_mode.enable=${COLLABORA_HOME_MODE:-false}
      username: ${COLLABORA_ADMIN_USER:-admin}
      password: ${COLLABORA_ADMIN_PASSWORD:-admin}
    cap_add:
      - MKNOD
    volumes:
      # Mount local TrueType fonts so the container can use system fonts
      # (e.g. Microsoft fonts like Arial, Calibri, Cambria by installing the `ttf-mscorefonts-installer` package).
      - /usr/share/fonts/truetype:/usr/share/fonts/truetype/more:ro
      - /usr/share/fonts/truetype:/opt/cool/systemplate/usr/share/fonts/truetype/more:ro
    expose:
      - "9980"
    logging:
      driver: ${LOG_DRIVER:-local}
    restart: always
    # Traefik labels are generated by Coolify from per-service domain assignments in the UI.
    entrypoint: [ '/bin/bash', '-c' ]
    command: [ 'coolconfig generate-proof-key && /start-collabora-online.sh' ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9980/hosting/discovery" ]
      interval: 15s
      timeout: 10s
      retries: 5

  tika:
    image: ${TIKA_IMAGE:-apache/tika:latest}
    # release notes: https://tika.apache.org
    networks:
      coolify:
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9998'" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: always
    logging:
      driver: ${LOG_DRIVER:-local}

  clamav:
    image: clamav/clamav:${CLAMAV_DOCKER_TAG:-latest}
    environment:
      # Accepts a number with optional K, M or G suffix. Must be greater or equal to ANTIVIRUS_MAX_SCAN_SIZE above.
      # K = KiB (1024), M = MiB (1024 * 1024), G = GiB (1024 * 1024 * 1024)
      CLAMD_CONF_StreamMaxLength: 100M
    networks:
      coolify:
    volumes:
      - clamav-socket:/tmp
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: [ "CMD", "/usr/local/bin/clamdcheck.sh" ]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: ${LOG_DRIVER:-local}
    restart: always

  radicale:
    image: ${RADICALE_DOCKER_IMAGE:-opencloudeu/radicale}:${RADICALE_DOCKER_TAG:-latest}
    user: ${OC_CONTAINER_UID_GID:-1000:1000}
    networks:
      coolify:
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:5232/" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    logging:
      driver: ${LOG_DRIVER:-local}
    restart: always
    configs:
      - source: radicale-config
        target: /etc/radicale/config
    volumes:
      - ./storage/services/radicale:/var/lib/radicale

  authentik-ldap:
    # Pin to match the Authentik server version to avoid outpost/server incompatibilities
    image: ghcr.io/goauthentik/ldap:2025.6.4
    networks:
      coolify:
    environment:
      AUTHENTIK_HOST: ${AUTHENTIK_HOST}
      AUTHENTIK_INSECURE: "${AUTHENTIK_INSECURE:-false}"
      AUTHENTIK_TOKEN: ${AUTHENTIK_LDAP_TOKEN}
    expose:
      - "3389" # LDAP
      - "6636" # LDAPS
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "--timeout=5", "http://localhost:9300/outpost.goauthentik.io/ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    logging:
      driver: ${LOG_DRIVER:-local}
    restart: always

configs:
  opencloud-csp:
    content: |
      directives:
        child-src:
          - "'self'"
          - "blob:"
        connect-src:
          - "'self'"
          - "blob:"
          - "https://${IDP_DOMAIN:-keycloak.opencloud.test}"
          - "https://${COLLABORA_DOMAIN:-collabora.opencloud.test}"
          - "wss://${COLLABORA_DOMAIN:-collabora.opencloud.test}"
          - "https://${COMPANION_DOMAIN:-companion.opencloud.test}"
          - "wss://${COMPANION_DOMAIN:-companion.opencloud.test}"
          - "https://raw.githubusercontent.com/opencloud-eu/awesome-apps/"
          - "https://update.opencloud.eu/"
        default-src:
          - "'none'"
        font-src:
          - "'self'"
        frame-ancestors:
          - "'self'"
          - "https://${OC_DOMAIN:-cloud.opencloud.test}"
          - "https://${COLLABORA_DOMAIN:-collabora.opencloud.test}"
        frame-src:
          - "'self'"
          - "blob:"
          - "https://${COLLABORA_DOMAIN:-collabora.opencloud.test}"
        img-src:
          - "'self'"
          - "blob:"
          - "data:"
          - "https://raw.githubusercontent.com/opencloud-eu/awesome-apps/"
        manifest-src:
          - "'self'"
        media-src:
          - "'self'"
        object-src:
          - "'self'"
          - "blob:"
        script-src:
          - "'self'"
          - "'unsafe-inline'"
        style-src:
          - "'self'"
          - "'unsafe-inline'"
        worker-src:
          - "'self'"
  opencloud-proxy:
    content: |
      # Forward CalDAV/CardDAV and .well-known endpoints to Radicale
      additional_policies:
        - name: default
          routes:
            - endpoint: /caldav/
              backend: http://radicale:5232
              remote_user_header: X-Remote-User
              skip_x_access_token: true
              additional_headers:
                - X-Script-Name: /caldav
            - endpoint: /.well-known/caldav
              backend: http://radicale:5232
              remote_user_header: X-Remote-User
              skip_x_access_token: true
              additional_headers:
                - X-Script-Name: /caldav
            - endpoint: /carddav/
              backend: http://radicale:5232
              remote_user_header: X-Remote-User
              skip_x_access_token: true
              additional_headers:
                - X-Script-Name: /carddav
            - endpoint: /.well-known/carddav
              backend: http://radicale:5232
              remote_user_header: X-Remote-User
              skip_x_access_token: true
              additional_headers:
                - X-Script-Name: /carddav
  radicale-config:
    content: |
      [server]
      hosts = 0.0.0.0:5232

      [auth]
      type = http_x_remote_user

      [storage]
      predefined_collections = {
          "def-addressbook": {
             "D:displayname": "Personal Address Book",
             "tag": "VADDRESSBOOK"
          },
          "def-calendar": {
             "C:supported-calendar-component-set": "VEVENT,VJOURNAL,VTODO",
             "D:displayname": "Personal Calendar",
             "tag": "VCALENDAR"
          }
        }

      [web]
      type = none

volumes:
  opencloud-config:
  opencloud-data:
  clamav-db:
  clamav-socket:
  radicale-data:

networks:
  coolify:
    external: true
